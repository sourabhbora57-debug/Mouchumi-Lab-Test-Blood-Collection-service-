            background: var(--card-bg);

            margin-bottom: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
        }
        .card-title i { color: var(--primary-blue); font-size: 17px; }

        /* Form Inputs */
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #1e293b;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            background: #fff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Search Input Box */
        .search-box-wrap {
            position: relative;
            margin-bottom: 12px;
        }
        .search-box-wrap i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
        }
        .search-box-wrap input {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 11px 12px 11px 36px;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box-wrap input:focus {
            background: #fff;
            border-color: var(--primary-blue);
        }

        /* Test Box Item */
        .tests-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .test-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .test-box.active {
            background: #f0fdf4;
            border-color: var(--active-border);
        }

        .test-box-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .custom-checkbox {
            width: 19px;
            height: 19px;
            border: 1.5px solid #94a3b8;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: transparent;
            background: #fff;
            flex-shrink: 0;
        }
        .test-box.active .custom-checkbox {
            background: var(--btn-green);
            border-color: var(--btn-green);
            color: #fff;
        }

        .test-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .test-name {
            font-size: 13.5px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.25;
        }
        .sub-details {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Badges */

            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;

        .vial-red { background: #fee2e2; color: #ef4444; }

        .vial-na { background: #f8fafc; color: #94a3b8; border: 1px solid #e2e8f0; }

            font-weight: 700;
            cursor: pointer;

            align-items: center;
            gap: 6px;
        }

</div>

        const v = vial.toUpperCase();

        if (v.includes('RED')) return 'vial-red';
        if (v.includes('BLUE')) return 'vial-blue';

            if (isViewAll) {
                // Pin selected tests to top when viewing all
                const selectedList = testData.filter(t => selectedMap.has(t.name));
                const unselectedList = testData.filter(t => !selectedMap.has(t.name));
                listToDisplay = [...selectedList, ...unselectedList];
            } else {
                // Show selected tests + top popular tests (limited compact view)
                const selectedList = testData.filter(t => selectedMap.has(t.name));
                const popularList = testData.filter(t => t.popular && !selectedMap.has(t.name));
                listToDisplay = [...selectedList, ...popularList];
            }
        }

        if (listToDisplay.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:18px; color:#94a3b8; font-size:13px;">কোনো টেষ্ট পোৱা নগ’ল</div>';
            return;
        }

        listToDisplay.forEach(item => {
            const isChecked = selectedMap.has(item.name);
            const badgeClass = getVialBadgeClass(item.vial);
            
            const div = document.createElement('div');
            div.className = `test-box ${isChecked ? 'active' : ''}`;
            div.onclick = () => toggleSelection(item);

            div.innerHTML = `
                <div class="test-box-left">
                    <div class="custom-checkbox">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="test-details">
                        <span class="test-name">${item.name}</span>
                        <div class="sub-details">
                            <span class="vial-badge ${badgeClass}">${item.vial}</span>
                        </div>
                    </div>
                </div>
                <div class="test-price">₹${item.price}</div>
            `;
            container.appendChild(div);
        });
    }

    function toggleSelection(item) {
        if (selectedMap.has(item.name)) {
            selectedMap.delete(item.name);
        } else {
            selectedMap.set(item.name, item.price);
        }
        updateBottomBar();
        renderTests();
    }

    function updateBottomBar() {
        const count = selectedMap.size;
        let sum = 0;
        selectedMap.forEach(p => sum += p);

        document.getElementById('countDisplay').innerText = count;
        document.getElementById('totalDisplay').innerText = `Total: ₹${sum.toLocaleString()}`;
    }

    function toggleViewAll() {
        isViewAll = !isViewAll;
        toggleBtn.innerHTML = isViewAll 
            ? 'Show Less <i class="fa-solid fa-angle-up"></i>' 
            : 'View All Tests (156) <i class="fa-solid fa-angle-down"></i>';
        renderTests();
    }

    // Instant Search Input Event
    searchInput.addEventListener('input', function() {
        renderTests();
    });

    // WhatsApp Receipt Trigger
    function proceedBooking() {
        const name = document.getElementById('patientName').value.trim();
        const age = document.getElementById('patientAge').value.trim();
        const sex = document.getElementById('patientSex').value;
        const phone = document.getElementById('patientPhone').value.trim();
        const address = document.getElementById('patientAddress').value.trim();

        if (!name || !age || !phone || !address) {
            alert('অনুগ্ৰহ কৰি ৰোগীৰ সকলো তথ্য পূৰণ কৰক (Please fill all patient details)');
            return;
        }

        if (selectedMap.size === 0) {
            alert('অনুগ্ৰহ কৰি অন্ততঃ এটা টেষ্ট বাচনি কৰক (Please select at least 1 test)');
            return;
        }

        let total = 0;
        const testList = [];
        selectedMap.forEach((price, test) => {
            total += price;
            testList.push(`• ${test} (₹${price})`);
        });

        const message = `*📋 NEW LAB TEST BOOKING RECEIPT*%0A` +
            `--------------------------------%0A` +
            `👤 *Patient:* ${name}%0A` +
            `🎂 *Age / Sex:* ${age} Yrs / ${sex}%0A` +
            `📞 *Phone:* ${phone}%0A` +
            `📍 *Address:* ${address}%0A` +
            `--------------------------------%0A` +
            `🧪 *Selected Tests (${selectedMap.size}):*%0A${testList.join('%0A')}%0A` +
            `--------------------------------%0A` +
            `💰 *Grand Total: ₹${total}*`;

        window.open(`https://wa.me/916000219209?text=${message}`, '_blank');
    }

    // Initial compact view
    renderTests();
</script>

</body>
</html>
